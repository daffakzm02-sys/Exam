workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
      groups:
        - hf_secrets   # berisi variabel rahasia HF_TOKEN
    scripts:
      - name: Build debug APK
        script: gradle assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
